{% extends 'layout.html' %}

{% block container %}
  <section class="bg-[#140b0a] py-20 px-10 flex items-center justify-center">
    <div class="relative w-[320px] pb-20">
      <div class="bg-[#E8D8C4] rounded-[40px] pt-10 pb-10 px-8 shadow-2xl">
        <div class="flex justify-center -mt-2 mb-8">
          <img src="{{ url_for('static', filename='img/contenido/usuarioLogin.png') }}" class="w-16" />
        </div>

        <form class="space-y-4">
          <div class="relative">
            <input type="text" placeholder="Usuario" class="w-full bg-input px-4 py-2.5 text-sm rounded-xl outline-none focus:ring-2 bg-[#C7B7A3] placeholder-stone-600" />
            <span class="absolute right-3 top-2.5 text-lg">👤</span>
          </div>

          <div class="relative">
            <input type="password" placeholder="Contraseña" class="w-full bg-input px-4 py-2.5 text-sm rounded-xl outline-none focus:ring-2 bg-[#C7B7A3] placeholder-stone-600" />
            <span class="absolute right-3 top-2.5 text-lg">🔒</span>
          </div>

          <div class="flex justify-center pt-4">
            <button class="bg-[#E8D8C4] px-8 py-2 rounded-full font-semibold text-sm text-stone-800 hover:bg-[#d7c7b3] transition shadow-lg tracking-wider">INICIAR</button>
          </div>

          <div class="text-center space-y-1.5 mt-4 text-white">
            <a href="#" class="block text-xs underline hover:opacity-80 transition">¿Olvidaste tu contraseña?</a>

            <div class="text-sm font-semibold cursor-pointer hover:underline transition">+ Registrar</div>
          </div>
        </form>
