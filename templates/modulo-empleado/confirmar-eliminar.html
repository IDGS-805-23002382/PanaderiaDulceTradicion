<!-- templates/modulo-empleado/confirmar-eliminar.html -->
{% extends 'layoutModulos.html' %}
{% block container %}
<div class="flex items-center justify-center min-h-[60vh]">
  <div style="background:white;" class="rounded-2xl shadow p-10 max-w-md w-full text-center">

    <img src="{{ url_for('static', filename='img/iconosModulos/borrar.png') }}"
         class="h-16 w-16 mx-auto mb-4"/>

    <h2 class="text-xl font-semibold mb-2" style="color:#341915;">¿Eliminar empleado?</h2>
    <p class="text-gray-600 mb-1">Estás a punto de eliminar a:</p>
    <p class="text-lg font-bold mb-6" style="color:#341915;">{{ empleado.nombre }}</p>
    <p class="text-sm text-gray-400 mb-8">Esta acción no se puede deshacer.</p>

    <div class="flex gap-4">

      <form method="POST" class="flex-1">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <button type="submit"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg transition border border-red-800">
          Sí, eliminar
        </button>
      </form>

      <a href="{{ url_for('empleados.index') }}" class="flex-1">
        <button class="w-full font-medium py-2 rounded-lg transition"
                style="border:1px solid #341915; color:#341915;">
          Cancelar
        </button>
      </a>

    </div>
  </div>
</div>
{% endblock %}
