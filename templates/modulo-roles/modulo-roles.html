<!-- template/modulo-roles/modulo-roles.html -->
 {% extends 'layoutModulos.html' %}
{% block container %}
<div class="w-full">

  <h1 class="text-2xl font-semibold text-center text-[#341915]">
    Gestión de Roles
  </h1>
  <div class="w-1/2 h-1 bg-[#341915] mx-auto mt-2 mb-8"></div>

  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-2 text-[#341915] font-medium">
      <img src="{{ url_for('static', filename='img/iconosModulos/filtrar.png') }}" class="h-6 w-6"/>
      <span>Filtrar</span>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex">
        <input type="text" id="buscador" placeholder="Buscar rol"
               class="border rounded-l px-4 py-2 w-64 bg-[#D7C7B0] placeholder-[#7a5a4d]" />
        <button class="bg-[#341915] px-4 rounded-r flex items-center justify-center">
          <img src="{{ url_for('static', filename='img/iconosModulos/lupa.png') }}" class="h-5 w-5"/>
        </button>
      </div>
      <a href="{{ url_for('roles.agregar') }}">
        <button class="bg-[#341915] p-2 rounded-full hover:bg-[#561C24] transition" title="Agregar rol">
          <img src="{{ url_for('static', filename='img/iconosModulos/roles.png') }}" class="h-5 w-5"/>
        </button>
      </a>
    </div>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-sm text-left">
      <thead class="bg-[#561C24] text-[#E8D8C4] text-center">
        <tr>
          <th class="px-4 py-2">Nombre</th>
          <th class="px-4 py-2">Descripción</th>
          <th class="px-4 py-2">Usuarios asignados</th>
          <th class="px-4 py-2">Acciones</th>
        </tr>
      </thead>
      <tbody class="bg-white" id="tablaRoles">
        {% for rol in roles %}
        <tr class="border-b text-center fila-rol">
          <td class="px-4 py-2 text-left font-medium">{{ rol.nombre }}</td>
          <td class="px-4 py-2">{{ rol.descripcion or '—' }}</td>
          <td class="px-4 py-2">{{ rol.usuarios | length }}</td>
          <td class="px-4 py-2 bg-[#561C24]">
            <div class="flex items-center justify-center gap-2">
              <a href="{{ url_for('roles.editar', id=rol.id_rol) }}">
                <button class="p-1 hover:bg-[#7a3a30] rounded" title="Editar">
                  <img src="{{ url_for('static', filename='img/iconosModulos/editar.png') }}" class="h-5 w-5"/>
                </button>
              </a>
              <a href="{{ url_for('roles.eliminar', id=rol.id_rol) }}"
                 onclick="return confirm('¿Eliminar este rol? Los usuarios asignados quedarán sin rol.')">
                <button class="p-1 hover:bg-[#7a3a30] rounded" title="Eliminar">
                  <img src="{{ url_for('static', filename='img/iconosModulos/borrar.png') }}" class="h-5 w-5"/>
                </button>
              </a>
            </div>
          </td>
        </tr>
        {% else %}
        <tr>
          <td colspan="4" class="text-center py-6 text-gray-500">No hay roles registrados</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</div>

<script>
  document.getElementById('buscador').addEventListener('keyup', function () {
    const f = this.value.toLowerCase();
    document.querySelectorAll('.fila-rol').forEach(r => {
      r.style.display = r.innerText.toLowerCase().includes(f) ? '' : 'none';
    });
  });
</script>
{% endblock %}
