{% extends 'layoutModulos.html' %}
{% block container %}

<!-- Sección Hero de bienvenida -->
<section class="relative bg-gradient-to-br from-[#E8D8C4] to-[#d4b6a0] min-h-[80vh] flex items-center justify-center overflow-hidden">
    
    <div class="container mx-auto px-4 relative z-10 text-center">
        
      
        <div class="mb-8 animate-fade-in-up">
            <h1 class="text-5xl md:text-7xl lg:text-8xl font-bold text-[#341915] mb-4 tracking-tight">
                Bienvenido
            </h1>
            <div class="w-24 h-1 bg-[#b55a3a] mx-auto rounded-full"></div>
        </div>
        
       
        <div class="animate-fade-in-up animation-delay-200">
            <h2 class="text-3xl md:text-5xl lg:text-6xl font-semibold text-[#b55a3a] mb-6 italic">
                Dulce Tradición
            </h2>
            <p class="text-lg md:text-xl text-[#5a3e32] max-w-2xl mx-auto leading-relaxed">
                Donde los sabores tradicionales cobran vida
            </p>
        </div>
        
    </div>
</section>

<style>
 
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .animate-fade-in-up {
        animation: fadeInUp 0.8s ease-out forwards;
        opacity: 0;
    }
    
    .animation-delay-200 {
        animation-delay: 0.2s;
    }
</style>

{% endblock %}
