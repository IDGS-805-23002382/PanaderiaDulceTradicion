{% extends 'layoutModulos.html' %}
{% block container %}



<section class="bg-[#d8c9b4] min-h-screen flex items-center justify-center py-12">
    <div class="bg-white rounded-2xl shadow-2xl border-t-8 border-[#6b1f26] p-10 w-full max-w-md">
        <h2 class="text-2xl font-black text-[#6b1f26] uppercase text-center mb-8">
            Seleccionar Sucursal
        </h2>
        <form action="{{ url_for('ventasSucursal.seleccionar_sucursal') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-6">
                <label class="block text-xs font-black text-[#6b1f26] uppercase mb-2">Sucursal</label>
                <select name="id_sucursal" required
                        class="w-full bg-white border-2 border-[#6b1f26] rounded-xl px-4 py-3 font-bold text-[#6b1f26]">
                    {% for s in sucursales %}
                    <option value="{{ s.id_sucursal }}">{{ s.nombre }} — {{ s.ciudad }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit"
                    class="w-full bg-[#6b1f26] text-white py-3 rounded-xl font-black uppercase tracking-widest hover:bg-[#4b1e1e] transition">
                Iniciar Venta
            </button>
        </form>
    </div>
</section>
{% endblock %}
