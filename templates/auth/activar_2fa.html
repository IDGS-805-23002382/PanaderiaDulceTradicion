{% extends 'layout.html' %}

{% block container %}
<section class="bg-[#140b0a] py-20 flex justify-center">
  <div class="bg-[#E8D8C4] p-8 rounded-2xl shadow-xl w-[320px] text-center">

    <h2 class="text-lg font-bold text-stone-800 mb-4">
      Activa tu verificación
    </h2>

    <p class="text-sm text-stone-700 mb-3">
      Agrega manualmente en Google Authenticator:
    </p>

    <div class="bg-white p-3 rounded-lg font-mono text-sm mb-4">
      {{ secret }}
    </div>

    <p class="text-xs text-stone-600 mb-4">
      Tipo: TOTP (30 segundos)
    </p>

    <a href="{{ url_for('auth.login') }}"
       class="bg-[#140b0a] text-white px-6 py-2 rounded-full">
       Ir a login
    </a>

  </div>
</section>
{% endblock %}
