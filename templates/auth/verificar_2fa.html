{% extends 'layout.html' %}
{% block container %}

<div class="flex justify-center items-center h-screen">
  <form method="POST" class="bg-white p-8 rounded-xl shadow-lg text-center">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <h2 class="text-xl font-bold mb-4">Verificación</h2>
    <p class="mb-4 text-sm text-gray-600">
      Ingresa el código que enviamos a tu correo
    </p>

    <input type="text" name="codigo" maxlength="6"
           class="border p-2 rounded w-full mb-4 text-center tracking-widest"
           placeholder="------" required>

    <button class="bg-[#561C24] text-white px-4 py-2 rounded w-full">
      Verificar
    </button>

  </form>
</div>

{% endblock %}
