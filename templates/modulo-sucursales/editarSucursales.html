{% extends "layoutModulos.html" %}

{% block container %}
<div class="min-h-screen bg-gradient-to-br from-amber-50 to-orange-100 py-12 px-4">
    <div class="max-w-4xl mx-auto">

        <div class="mb-6">
            <a href="{{ url_for('sucursales.sucursales') }}" 
               class="text-[#341915] font-semibold hover:underline flex items-center gap-2">
                ← Volver a la lista de sucursales
            </a>
        </div>

        <div class="bg-white shadow-2xl rounded-2xl overflow-hidden">
            <div class="bg-[#341915] p-6 text-white text-center">
                <h2 class="text-2xl font-bold uppercase tracking-wide">
                    Editar Sucursal: {{ sucursal.nombre }}
                </h2>
            </div>

            <form action="{{ url_for('sucursales.editarSucursal', id=sucursal.id_sucursal) }}" method="POST" class="p-8">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Nombre</label>
                        <input type="text" name="nombre" value="{{ sucursal.nombre }}" required
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Correo Electrónico</label>
                        <input type="email" name="email" value="{{ sucursal.email or '' }}" 
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Teléfono</label>
                        <input type="text" name="telefono" value="{{ sucursal.telefono or '' }}"
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Ciudad</label>
                        <input type="text" name="ciudad" value="{{ sucursal.ciudad or '' }}"
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Estado</label>
                        <input type="text" name="estado" value="{{ sucursal.estado or '' }}"
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Código Postal</label>
                        <input type="text" name="codigo_postal" value="{{ sucursal.codigo_postal or '' }}"
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Estatus</label>
                        <select name="estatus" class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                            <option value="activo" {% if sucursal.estatus == 'activo' %}selected{% endif %}>Activo</option>
                            <option value="inactivo" {% if sucursal.estatus == 'inactivo' %}selected{% endif %}>Inactivo</option>
                        </select>
                    </div>

                         <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            Latitud
                        </label>
                        <input type="text"
                                name="latitud"
                                value="{{ sucursal.latitud | default('') }}"
                                placeholder="Ej: 21.1227"
                                class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                        </div>

                        <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">
                            Longitud
                        </label>
                        <input type="text"
                                name="longitud"
                                value="{{ sucursal.longitud | default('') }}"
                                placeholder="Ej: -101.6822"
                                class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                        </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-1">Dirección (Calle y Número)</label>
                        <input type="text" name="direccion" value="{{ sucursal.direccion or '' }}"
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-gray-700 mb-1">URL de la Imagen</label>
                        <input type="text" name="imagen_url" value="{{ sucursal.imagen_url or '' }}"
                               class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">
                    </div>
                </div>

                <div class="mt-10 flex gap-4">
                    <button type="submit"
                            class="flex-1 bg-[#341915] text-white px-6 py-3 rounded-xl font-bold hover:bg-[#4a241d] transition-all shadow-lg">
                        <i class="fas fa-save mr-2"></i>Guardar Cambios
                    </button>
                    <a href="{{ url_for('sucursales.gestion_sucursales') }}"
                       class="flex-1 bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-bold hover:bg-gray-300 text-center transition-all">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
