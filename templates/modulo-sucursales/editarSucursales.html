{% extends "layoutModulos.html" %}
{% block container %}

<div class="min-h-screen bg-gradient-to-br from-amber-50 to-orange-100 py-12 px-4">

<div class="max-w-3xl mx-auto">


<div class="mb-6">
<a href="{{ url_for('sucursales.sucursales') }}"
class="text-[#341915] font-semibold hover:underline">

← Volver a la lista de sucursales

</a>
</div>

<div class="bg-white shadow-xl rounded-2xl p-8">

<h2 class="text-2xl font-bold text-[#341915] mb-6">
Editar Sucursal
</h2>

<form action="{{ url_for('sucursales.editarSucursal', id=sucursal.id_sucursal) }}" method="POST">

  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">


<div>
<label class="block text-sm font-semibold text-gray-700 mb-1">
Nombre
</label>

<input type="text"
name="nombre"
value="{{ sucursal.nombre }}"
class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">

</div>


<div>
<label class="block text-sm font-semibold text-gray-700 mb-1">
Teléfono
</label>

<input type="text"
name="telefono"
value="{{ sucursal.telefono }}"
class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">

</div>


<div class="md:col-span-2">
<label class="block text-sm font-semibold text-gray-700 mb-1">
Dirección
</label>

<input type="text"
name="direccion"
value="{{ sucursal.direccion }}"
class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">

</div>


<div>
<label class="block text-sm font-semibold text-gray-700 mb-1">
Ciudad
</label>

<input type="text"
name="ciudad"
value="{{ sucursal.ciudad }}"
class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">

</div>


<div>
<label class="block text-sm font-semibold text-gray-700 mb-1">
Estatus
</label>

<select name="estatus"
class="w-full border-2 border-gray-200 rounded-lg px-4 py-2 focus:border-[#341915] outline-none">

<option value="activo"
{% if sucursal.estatus == 'activo' %}selected{% endif %}>
Activo
</option>

<option value="inactivo"
{% if sucursal.estatus == 'inactivo' %}selected{% endif %}>
Inactivo
</option>

</select>

</div>

</div>


<div class="mt-8 flex gap-4">

<button type="submit"
class="bg-[#341915] text-white px-6 py-3 rounded-lg hover:bg-[#4a241d] transition">

Guardar Cambios

</button>

<a href="{{ url_for('sucursales.sucursales') }}"
class="bg-gray-300 px-6 py-3 rounded-lg hover:bg-gray-400 transition">

Cancelar

</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
