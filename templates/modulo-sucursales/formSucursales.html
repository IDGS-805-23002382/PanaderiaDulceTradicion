{% extends "layoutModulos.html" %}

{% block container %}

<div class="max-w-xl mx-auto bg-white p-8 rounded shadow">

<h2 class="text-2xl font-bold text-[#341915] mb-6">
Nueva sucursal
</h2>


<form method="POST" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div>
<label class="block font-medium">Nombre</label>
<input type="text" name="nombre"
class="w-full border rounded p-2">
</div>

<div>
<label class="block font-medium">Dirección</label>
<input type="text" name="direccion"
class="w-full border rounded p-2">
</div>

<div>
<label class="block font-medium">Teléfono</label>
<input type="text" name="telefono"
class="w-full border rounded p-2">
</div>

<div>
<label class="block font-medium">Ciudad</label>
<input type="text" name="ciudad"
class="w-full border rounded p-2">
</div>

<div class="flex gap-3">

<button type="submit"
class="bg-[#341915] text-white px-4 py-2 rounded hover:bg-[#4b231c]">

Guardar

</button>

<a href="/sucursales"
class="bg-[#341915] text-white px-4 py-2 rounded hover:bg-[#4b231c]">

Cancelar

</a>

</div>

</form>

</div>

{% endblock %}
